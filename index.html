<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo SSE — Go</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e2e2e8;
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f0f0f5;
    }

    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

    /* Status bar */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #1a1a22;
      border: 1px solid #2a2a35;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #444; transition: background 0.3s;
    }
    .dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    #status-text { color: #aaa; }
    #client-count { margin-left: auto; color: #888; font-size: 12px; }

    /* Grid layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

    /* Cards */
    .card {
      background: #1a1a22;
      border: 1px solid #2a2a35;
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 16px;
    }

    /* Stocks */
    .stock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stock-item {
      background: #12121a;
      border: 1px solid #22222e;
      border-radius: 8px;
      padding: 12px;
      transition: border-color 0.3s;
    }

    .stock-item.up { border-color: #166534; }
    .stock-item.down { border-color: #7f1d1d; }

    .stock-symbol { font-size: 12px; color: #888; font-weight: 600; }
    .stock-price {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin: 4px 0 2px;
    }
    .stock-change {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .up .stock-price { color: #4ade80; }
    .up .stock-change { color: #22c55e; }
    .down .stock-price { color: #f87171; }
    .down .stock-change { color: #ef4444; }

    /* Notifications */
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .notif-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px;
      background: #12121a;
      border-left: 3px solid #333;
      border-radius: 6px;
      font-size: 13px;
      animation: slideIn 0.3s ease;
    }

    .notif-item.info    { border-left-color: #3b82f6; }
    .notif-item.success { border-left-color: #22c55e; }
    .notif-item.warning { border-left-color: #f59e0b; }

    .notif-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .notif-title { font-weight: 600; color: #ddd; margin-bottom: 2px; }
    .notif-msg { color: #888; }

    /* Activity feed */
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 300px;
      overflow-y: auto;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      padding: 8px 10px;
      background: #12121a;
      border-radius: 6px;
      animation: slideIn 0.3s ease;
    }

    .activity-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #2a2a3a;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #aaa;
      flex-shrink: 0;
    }

    .activity-joined .activity-avatar { background: #14532d; color: #4ade80; }
    .activity-left   .activity-avatar { background: #3b1010; color: #f87171; }

    /* Log brut */
    #raw-log {
      font-family: monospace;
      font-size: 12px;
      background: #0a0a10;
      border: 1px solid #1a1a25;
      border-radius: 8px;
      padding: 12px;
      height: 200px;
      overflow-y: auto;
      color: #666;
      grid-column: 1 / -1;
    }

    .log-line { line-height: 1.8; }
    .log-line .tag { color: #7c3aed; }
    .log-line .data { color: #4ade80; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<h1>Demo SSE — Serveur Go</h1>
<p class="subtitle">Connexion en temps réel via Server-Sent Events</p>

<div id="status-bar">
  <div class="dot" id="dot"></div>
  <span id="status-text">Connexion en cours…</span>
  <span id="client-count"></span>
</div>

<div class="grid">
  <!-- Stocks -->
  <div class="card">
    <div class="card-title">📈 Cours en temps réel</div>
    <div class="stock-grid" id="stocks"></div>
  </div>

  <!-- Notifications -->
  <div class="card">
    <div class="card-title">🔔 Notifications</div>
    <div class="notif-list" id="notifications">
      <div style="color:#555;font-size:13px">En attente des notifications…</div>
    </div>
  </div>

  <!-- Activity -->
  <div class="card">
    <div class="card-title">👥 Activité utilisateurs</div>
    <div class="activity-list" id="activity">
      <div style="color:#555;font-size:13px">En attente d'activité…</div>
    </div>
  </div>

  <!-- Raw log -->
  <div class="card" style="padding:16px">
    <div class="card-title" style="margin-bottom:10px">📡 Log SSE brut</div>
    <div id="raw-log"></div>
  </div>
</div>

<script>
  const stocks = {};
  const icons = { info: 'ℹ️', success: '✅', warning: '⚠️' };

  // ── connexion SSE ──────────────────────────────────────────────
  const source = new EventSource('/events');

  source.addEventListener('connected', e => {
    const d = JSON.parse(e.data);
    document.getElementById('dot').classList.add('connected');
    document.getElementById('status-text').textContent =
      `Connecté · ID : ${d.clientId}`;
    log('connected', d);
    refreshCount();
  });

  source.addEventListener('stock', e => {
    const d = JSON.parse(e.data);
    updateStock(d);
    log('stock', d);
  });

  source.addEventListener('notification', e => {
    const d = JSON.parse(e.data);
    addNotification(d);
    log('notification', d);
  });

  source.addEventListener('user_activity', e => {
    const d = JSON.parse(e.data);
    addActivity(d);
    log('user_activity', d);
  });

  source.onerror = () => {
    document.getElementById('dot').classList.remove('connected');
    document.getElementById('status-text').textContent = 'Déconnecté — reconnexion…';
  };

  // ── stocks ────────────────────────────────────────────────────
  function updateStock({ symbol, price, change }) {
    stocks[symbol] = { price, change };
    const container = document.getElementById('stocks');
    let el = document.getElementById('stock-' + symbol);
    if (!el) {
      el = document.createElement('div');
      el.id = 'stock-' + symbol;
      el.className = 'stock-item';
      el.innerHTML = `<div class="stock-symbol">${symbol}</div>
        <div class="stock-price" id="p-${symbol}"></div>
        <div class="stock-change" id="c-${symbol}"></div>`;
      container.appendChild(el);
    }
    el.className = 'stock-item ' + (change >= 0 ? 'up' : 'down');
    document.getElementById('p-' + symbol).textContent = '$' + price.toFixed(2);
    const sign = change >= 0 ? '+' : '';
    document.getElementById('c-' + symbol).textContent = sign + change.toFixed(2);
  }

  // ── notifications ─────────────────────────────────────────────
  function addNotification({ title, message, level }) {
    const list = document.getElementById('notifications');
    if (list.querySelector('[style]')) list.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'notif-item ' + level;
    el.innerHTML = `<div class="notif-icon">${icons[level] || 'ℹ️'}</div>
      <div><div class="notif-title">${title}</div>
      <div class="notif-msg">${message}</div></div>`;
    list.prepend(el);
    if (list.children.length > 8) list.removeChild(list.lastChild);
  }

  // ── activité ──────────────────────────────────────────────────
  function addActivity({ name, action }) {
    const list = document.getElementById('activity');
    if (list.querySelector('[style]')) list.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'activity-item activity-' + action;
    const verb = action === 'joined' ? 'a rejoint' : 'a quitté';
    el.innerHTML = `<div class="activity-avatar">${name[0]}</div>
      <span><strong>${name}</strong> ${verb} le salon</span>`;
    list.prepend(el);
    if (list.children.length > 10) list.removeChild(list.lastChild);
  }

  // ── log brut ──────────────────────────────────────────────────
  function log(event, data) {
    const el = document.getElementById('raw-log');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="tag">event: ${event}</span>  <span class="data">${JSON.stringify(data)}</span>`;
    el.prepend(line);
    if (el.children.length > 50) el.removeChild(el.lastChild);
  }

  // ── compteur clients ──────────────────────────────────────────
  function refreshCount() {
    fetch('/clients')
      .then(r => r.json())
      .then(d => {
        document.getElementById('client-count').textContent =
          `${d.count} client${d.count > 1 ? 's' : ''} connecté${d.count > 1 ? 's' : ''}`;
      });
  }
  setInterval(refreshCount, 5000);
</script>
</body>
</html>
